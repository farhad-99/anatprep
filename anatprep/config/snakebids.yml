#list of analysis levels in the bids app
analysis_levels: &analysis_levels
 - participant

#mapping from analysis_level to set of target rules or files
targets_by_analysis_level:
  participant:
    - 'all'

pybids_inputs:
  mri:
    filters:
      suffix: 'T2starw'
      extension: 'nii.gz'
      datatype: 'anat'
      reconstruction: false   # exclude rec- files; keep only echo- variants
    wildcards:
      - subject
      - session
      - acquisition
      - run
      - echo
      - suffix
      - extension


#configuration for the command-line parameters to make available
parse_args:
  --bids_dir:
    help: "Path to the raw BIDS dataset directory"
    type: str
    required: True

  --output_dir:
    help: "Path to the output directory"
    type: str
    required: True

  --target_template:
    help: "Target template to register mri-atlas to (default: %(default)s)"
    default: ABAv3

  --template_path:
    help: "Path to the initial mean image for first-pass registration"
    type: str
    required: True

  --template_path_target:
    help: "Path to the target template NIfTI image"
    type: str
    required: True

  --template_mri:
    help: "Template to use for MRI registration to obtain brain mask"
    default: MouseIn
    choices:
      - MouseIn
      - DSURQE
      - MBMv3
      - turone

  --mri_resample_percent:
    help: "Resampling factor for multi-MRI averaging as a percent (default: %(default)s)"
    default: 100

  --skip-bids-validation:
    help: |
      Skip validation of BIDS dataset. BIDS validation is performed by
      default using the bids-validator plugin (if installed/enabled) or with the pybids
      validator implementation (if bids-validator is not installed/enabled).
    dest: "plugins.validator.skip"
    action: "store_true"
    default: False


#--- workflow specific configuration ---

bids_dir: null
output_dir: null
target_template: ABAv3
template_path: null
template_path_target: null
template_mri: MouseIn
mri_resample_percent: 100

templates:
  MouseIn:
    anat: 'tpl-MouseIn/tpl-MouseIn_res-1_inv-1_MP2RAGE.nii.gz'
    mask: 'tpl-MouseIn/tpl-MouseIn_res-1_desc-brain_mask.nii.gz'

  MBMv3:
    anat: 'tpl-MBMv3/tpl-MBMv3_T2w.nii.gz'
    mask: 'tpl-MBMv3/tpl-MBMv3_desc-brain_mask.nii.gz'

  turone:
    anat: 'tpl-turone/tpl-turone_T2w.nii.gz'

  DSURQE:
    anat: '/nfs/khan/trainees/ffallahz/ki3/bids/tpl-DSURQE/tpl-DSURQE_anat.nii.gz'
    mask: '/nfs/khan/trainees/ffallahz/ki3/bids/tpl-DSURQE/tpl-DSURQE_desc-brain_mask.nii.gz'
